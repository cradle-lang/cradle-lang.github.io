name: Generate CradleXC release notes with Copilot

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CradleXC tag to analyze, for example v0.18.1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-cradlexc-release-notes-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate input
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}

      - name: Checkout CradleXC at requested tag
        uses: actions/checkout@v4
        with:
          repository: cradle-lang/CradleXC
          ref: ${{ inputs.tag }}
          path: upstream-cradlexc
          fetch-depth: 0
          token: ${{ secrets.CRADLE_RELEASES_TOKEN }}

      - name: Ensure the release note does not already exist
        shell: bash
        env:
          TARGET: release-notes/${{ inputs.tag }}.md
        run: |
          set -euo pipefail
          if [[ -e "$TARGET" ]]; then
            echo "::error::$TARGET already exists and requires human handling."
            exit 1
          fi

      - name: Install GitHub Copilot CLI
        shell: bash
        run: npm install --global @github/copilot@1.0.83

      - name: Generate release note
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          TAG: ${{ inputs.tag }}
          TARGET: release-notes/${{ inputs.tag }}.md
        run: |
          set -euo pipefail
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::COPILOT_CLI_TOKEN is not configured."
            exit 1
          fi

          prompt="$(cat .github/prompts/generate-cradlexc-release-notes.md)

          Requested tag: $TAG
          Output path: $TARGET"

          copilot \
            --prompt "$prompt" \
            --no-ask-user \
            --no-custom-instructions \
            --disable-builtin-mcps \
            --max-ai-credits 40 \
            --allow-tool "write(${GITHUB_WORKSPACE}/${TARGET})" \
            --allow-tool 'shell(cat)' \
            --allow-tool 'shell(cd)' \
            --allow-tool 'shell(date)' \
            --allow-tool 'shell(find)' \
            --allow-tool 'shell(git cat-file:*)' \
            --allow-tool 'shell(git describe:*)' \
            --allow-tool 'shell(git diff:*)' \
            --allow-tool 'shell(git log:*)' \
            --allow-tool 'shell(git show:*)' \
            --allow-tool 'shell(git show-ref:*)' \
            --allow-tool 'shell(git status)' \
            --allow-tool 'shell(git tag:*)' \
            --allow-tool 'shell(grep)' \
            --allow-tool 'shell(head)' \
            --allow-tool 'shell(ls)' \
            --allow-tool 'shell(pwd)' \
            --allow-tool 'shell(rg)' \
            --allow-tool 'shell(sed)' \
            --allow-tool 'shell(sort)' \
            --allow-tool 'shell(tail)' \
            --allow-tool 'shell(wc)'

          if [[ ! -s "$TARGET" ]]; then
            echo "::error::Copilot did not create $TARGET."
            exit 1
          fi

      - name: Verify Copilot changed only the requested note
        shell: bash
        env:
          TARGET: release-notes/${{ inputs.tag }}.md
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | grep -v '^upstream-cradlexc/$' | sort -u
          )

          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "$TARGET" ]]; then
            printf '::error::Unexpected file changed: %s\n' "${changed[@]}"
            exit 1
          fi

      - name: Validate generated release note
        shell: bash
        env:
          TARGET: release-notes/${{ inputs.tag }}.md
        run: |
          set -euo pipefail
          npm ci
          npx --yes markdownlint-cli2@0.18.1 "$TARGET"
          npm run generate-release-notes
          git restore --worktree src/data/release-notes.json

      - name: Commit and push automation branch
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: release-notes/${{ inputs.tag }}.md
          BRANCH: release-notes/${{ inputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAG" > release-notes/.last-processed-release

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin \
            "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH"
          git add -- "$TARGET" release-notes/.last-processed-release
          git commit -m "Add release notes for $TAG"
          git push --force-with-lease --set-upstream origin "$BRANCH"

      - name: Create or update draft pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}
          TAG: ${{ inputs.tag }}
          BRANCH: release-notes/${{ inputs.tag }}
        run: |
          set -euo pipefail
          body="$(printf '%s\n' \
            "## Summary" \
            "" \
            "Adds Copilot-generated release notes for CradleXC $TAG based on the tagged source, Git history, tests, and existing documentation style." \
            "" \
            "## Validation" \
            "" \
            "- Ran Markdown linting on the generated note." \
            "- Ran \`npm run generate-release-notes\`." \
            "" \
            "This draft requires human editorial and technical review before merging.")"

          number="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "Add release notes for $TAG" --body "$body"
          else
            gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "Add release notes for $TAG" \
              --body "$body"
          fi
