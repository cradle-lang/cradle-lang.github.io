name: Prepare CradleXC release documentation with Copilot
run-name: Prepare CradleXC ${{ inputs.tag }} historical=${{ inputs.historical_test }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CradleXC release tag to analyze
        required: true
        type: string
      expected_sha:
        description: Expected upstream commit SHA; required for production runs
        required: false
        type: string
      historical_test:
        description: Test all outputs with an older tag; creates a test-only draft
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: >-
    ${{ inputs.historical_test &&
    format('prepare-cradlexc-release-test-{0}', inputs.tag) ||
    'prepare-cradlexc-release-production' }}
  cancel-in-progress: false

jobs:
  admission:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.capacity.outputs.proceed }}

    steps:
      - name: Check final-generation capacity
        id: capacity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          HISTORICAL_TEST: ${{ inputs.historical_test }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

          if [[ "$HISTORICAL_TEST" == 'true' ]]; then
            if [[ -n "$EXPECTED_SHA" && ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Invalid expected commit SHA: $EXPECTED_SHA"
              exit 1
            fi
            echo "Historical test $TAG does not consume production release capacity."
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::A full expected commit SHA is required for production release $TAG."
            exit 1
          fi

          blocking_count="$(
            gh pr list \
              --state open \
              --limit 100 \
              --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("release/"))] | length'
          )"

          if [[ "$blocking_count" -gt 0 ]]; then
            echo "A production release documentation PR is already open."
            gh pr list \
              --state open \
              --limit 100 \
              --json number,headRefName,url \
              --jq '.[] | select(.headRefName | startswith("release/")) | "- PR #\(.number): \(.headRefName) — \(.url)"'
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Production release capacity is available for $TAG."
          echo 'proceed=true' >> "$GITHUB_OUTPUT"

  prepare:
    needs: admission
    if: needs.admission.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate input
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          HISTORICAL_TEST: ${{ inputs.historical_test }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi

      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}

      - name: Apply release policy
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          HISTORICAL_TEST: ${{ inputs.historical_test }}
        run: |
          set -euo pipefail
          mode='production'
          if [[ "$HISTORICAL_TEST" == 'true' ]]; then
            mode='historical-test'
          fi
          node scripts/check-release-policy.mjs "$mode" "$TAG"

      - name: Checkout CradleXC at requested tag
        uses: actions/checkout@v4
        with:
          repository: cradle-lang/CradleXC
          ref: ${{ inputs.tag }}
          path: upstream-cradlexc
          fetch-depth: 0
          token: ${{ secrets.CRADLE_RELEASES_TOKEN }}

      - name: Verify requested tag and target
        id: upstream
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          HISTORICAL_TEST: ${{ inputs.historical_test }}
          TAG: ${{ inputs.tag }}
          TARGET: release-notes/${{ inputs.tag }}.md
        run: |
          set -euo pipefail
          resolved="$(git -C upstream-cradlexc rev-list -n 1 "$TAG")"
          actual="$(git -C upstream-cradlexc rev-parse HEAD)"
          node scripts/check-release-identity.mjs \
            "$TAG" \
            "$EXPECTED_SHA" \
            "$resolved" \
            "$actual" \
            "$HISTORICAL_TEST"
          if [[ -e "$TARGET" ]]; then
            echo "::error::$TARGET already exists and requires human handling."
            exit 1
          fi

      - name: Install website dependencies
        shell: bash
        run: npm ci

      - name: Archive documentation for the current released version
        id: archive
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          HISTORICAL_TEST: ${{ inputs.historical_test }}
        run: |
          set -euo pipefail
          previous="$({
            git ls-files 'release-notes/v*.md' |
              sed -nE 's#^release-notes/(v[0-9]+\.[0-9]+\.[0-9]+)\.md$#\1#p' |
              sort -V |
              tail -n 1
          } || true)"

          if [[ -z "$previous" ]]; then
            echo "::error::A previous stable release note is required before preparing a new release."
            exit 1
          fi

          echo "Latest stable release note identifies the current documentation as $previous."
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

          if [[ "$previous" == "$TAG" ]]; then
            echo "::error::The requested release note already exists for $TAG."
            exit 1
          fi

          if ! git -C upstream-cradlexc rev-parse --verify --quiet "refs/tags/$previous" >/dev/null; then
            echo "::error::The latest release-note version does not exist as an upstream tag: $previous"
            exit 1
          fi
          previous_sha="$(git -C upstream-cradlexc rev-list -n 1 "$previous")"
          if [[ ! "$previous_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a full commit SHA for previous tag $previous."
            exit 1
          fi
          echo "sha=$previous_sha" >> "$GITHUB_OUTPUT"
          if ! git -C upstream-cradlexc merge-base --is-ancestor "$previous" "$TAG"; then
            if [[ "$HISTORICAL_TEST" != "true" ]]; then
              echo "::error::$TAG is not a new descendant of the current documented release $previous."
              echo "::error::Use historical_test only for a manual, test-only draft."
              exit 1
            fi
            echo "::warning::Historical test mode is enabled for $TAG."
            echo "::warning::The resulting PR is test-only and must never be merged."
          fi

          version="${previous#v}"
          terminal_data='src/data/homepage-terminal.json'
          terminal_snapshot="$RUNNER_TEMP/homepage-terminal.json"
          if [[ ! -f "$terminal_data" ]]; then
            echo "::error::Missing animated-terminal data file: $terminal_data"
            exit 1
          fi
          jq --arg tag "$previous" --arg version "$version" '
            if .current.tag != $tag then
              error("current terminal transcript does not match " + $tag)
            elif .versions[$version] != null then
              .
            else
              .versions[$version] = .current
            end
          ' "$terminal_data" > "$terminal_snapshot"
          mv "$terminal_snapshot" "$terminal_data"
          jq -e --arg version "$version" '.versions[$version] != null' "$terminal_data" >/dev/null
          git add -- "$terminal_data"

          if jq -e --arg version "$version" 'index($version) != null' versions.json >/dev/null; then
            echo "Documentation version $version is already archived."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm run docusaurus -- docs:version "$version"

          test -d "versioned_docs/version-$version"
          test -f "versioned_sidebars/version-$version-sidebars.json"
          jq -e --arg version "$version" 'index($version) != null' versions.json >/dev/null

          # Stage the deterministic snapshot before Copilot runs. Any later AI
          # modification to these files will then appear as an unstaged change
          # and be rejected by the approved-path guard.
          git add -- \
            versions.json \
            "versioned_docs/version-$version" \
            "versioned_sidebars/version-$version-sidebars.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic release evidence
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          PREVIOUS_TAG: ${{ steps.archive.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/generate-release-evidence.mjs \
            upstream-cradlexc \
            release-notes/evidence \
            "$PREVIOUS_TAG" \
            "$TAG"

      - name: Verify or reconstruct release evidence
        id: evidence
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TAG_SHA: ${{ steps.upstream.outputs.sha }}
          PREVIOUS_TAG: ${{ steps.archive.outputs.tag }}
          PREVIOUS_SHA: ${{ steps.archive.outputs.sha }}
          HISTORICAL_TEST: ${{ inputs.historical_test }}
        run: |
          set -euo pipefail
          node scripts/verify-release-evidence.mjs \
            upstream-cradlexc \
            "release-notes/evidence/$TAG.json" \
            "$PREVIOUS_TAG" \
            "$PREVIOUS_SHA" \
            "$TAG" \
            "$TAG_SHA" \
            "$HISTORICAL_TEST"
          git add -- "release-notes/evidence/$TAG.json"

      - name: Record release provenance
        if: inputs.historical_test != true
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ steps.upstream.outputs.sha }}
          PREVIOUS_TAG: ${{ steps.archive.outputs.tag }}
          PREVIOUS_SHA: ${{ steps.archive.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/write-release-provenance.mjs \
            release-notes \
            "$TAG" \
            "$TARGET_SHA" \
            "$PREVIOUS_TAG" \
            "$PREVIOUS_SHA"
          git add -- "release-notes/provenance/$TAG.json"

      - name: Preprocess release impact
        id: prework
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          EVIDENCE_PATH: ${{ steps.evidence.outputs.path }}
        run: |
          set -euo pipefail
          node scripts/generate-release-prework.mjs \
            upstream-cradlexc \
            "$EVIDENCE_PATH" \
            docs \
            release-notes/prework
          git add -- "release-notes/prework/$TAG.json"

      - name: Install GitHub Copilot CLI
        shell: bash
        run: npm install --global @github/copilot@1.0.83

      - name: Prepare release documentation
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          TAG: ${{ inputs.tag }}
          TARGET: release-notes/${{ inputs.tag }}.md
          PREVIOUS_TAG: ${{ steps.archive.outputs.tag }}
          EVIDENCE_PATH: ${{ steps.evidence.outputs.path }}
          EVIDENCE_SHA256: ${{ steps.evidence.outputs.sha256 }}
          PREWORK_PATH: ${{ steps.prework.outputs.path }}
          IMPACT_CLASSIFICATION: ${{ steps.prework.outputs.classification }}
          REQUIRES_DOCUMENTATION: ${{ steps.prework.outputs.requires_documentation }}
          HISTORICAL_TEST: ${{ inputs.historical_test }}
        run: |
          set -euo pipefail
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::COPILOT_CLI_TOKEN is not configured."
            exit 1
          fi

          prompt="$(cat .github/prompts/prepare-cradlexc-release.md)

          Requested release tag: $TAG
          Release-note output path: $TARGET
          Latest stable release-note tag before this run: $PREVIOUS_TAG
          Deterministic release-evidence path: $EVIDENCE_PATH
          Release-evidence SHA-256: $EVIDENCE_SHA256
          Deterministic prework path: $PREWORK_PATH
          Documentation-impact classification: $IMPACT_CLASSIFICATION
          User-documentation update required: $REQUIRES_DOCUMENTATION
          Historical test mode: $HISTORICAL_TEST"

          copilot \
            --prompt "$prompt" \
            --no-ask-user \
            --no-custom-instructions \
            --disable-builtin-mcps \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            --max-ai-credits 60 \
            --allow-tool write \
            --allow-tool 'shell(cat)' \
            --allow-tool 'shell(cd)' \
            --allow-tool 'shell(date)' \
            --allow-tool 'shell(find)' \
            --allow-tool 'shell(git cat-file:*)' \
            --allow-tool 'shell(git describe:*)' \
            --allow-tool 'shell(git diff:*)' \
            --allow-tool 'shell(git log:*)' \
            --allow-tool 'shell(git merge-base:*)' \
            --allow-tool 'shell(git rev-list:*)' \
            --allow-tool 'shell(git rev-parse:*)' \
            --allow-tool 'shell(git show:*)' \
            --allow-tool 'shell(git show-ref:*)' \
            --allow-tool 'shell(git status)' \
            --allow-tool 'shell(git tag:*)' \
            --allow-tool 'shell(grep)' \
            --allow-tool 'shell(head)' \
            --allow-tool 'shell(ls)' \
            --allow-tool 'shell(pwd)' \
            --allow-tool 'shell(rg)' \
            --allow-tool 'shell(sed)' \
            --allow-tool 'shell(sort)' \
            --allow-tool 'shell(tail)' \
            --allow-tool 'shell(wc)'

          if [[ ! -s "$TARGET" ]]; then
            echo "::error::Copilot did not create the required $TARGET."
            exit 1
          fi

      - name: Verify Copilot changed only approved paths
        id: initial_changes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: release-notes/${{ inputs.tag }}.md
          REQUIRES_DOCUMENTATION: ${{ steps.prework.outputs.requires_documentation }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | grep -v '^upstream-cradlexc/$' | sort -u
          )

          found_target=false
          docs_changed=false
          homepage_changed=false
          terminal_changed=false
          readme_changed=false
          contributing_changed=false
          for path in "${changed[@]}"; do
            case "$path" in
              "$TARGET") found_target=true ;;
              docs/*) docs_changed=true ;;
              src/pages/index.tsx|src/components/homepage/*|static/img/home/*) homepage_changed=true ;;
              src/data/homepage-terminal.json)
                homepage_changed=true
                terminal_changed=true
                ;;
              README.rst) readme_changed=true ;;
              CONTRIBUTING.md) contributing_changed=true ;;
              *)
                echo "::error::Copilot changed a disallowed path: $path"
                exit 1
                ;;
            esac
          done

          if [[ "$found_target" != true ]]; then
            echo "::error::Copilot did not create the required $TARGET."
            exit 1
          fi
          if [[ "$REQUIRES_DOCUMENTATION" == true && "$docs_changed" != true ]]; then
            echo "::error::Copilot did not update any user documentation under docs/."
            exit 1
          fi
          if [[ "$terminal_changed" != true ]]; then
            echo "::error::Copilot did not update the animated-terminal transcript."
            exit 1
          fi
          if ! jq -e --arg tag "$TAG" '.current.tag == $tag' src/data/homepage-terminal.json >/dev/null; then
            echo "::error::The current terminal transcript does not identify $TAG."
            exit 1
          fi
          staged_versions="$(git show :src/data/homepage-terminal.json | jq -S -c '.versions')"
          current_versions="$(jq -S -c '.versions' src/data/homepage-terminal.json)"
          if [[ "$current_versions" != "$staged_versions" ]]; then
            echo "::error::Copilot modified an archived terminal transcript."
            exit 1
          fi
          {
            echo "count=${#changed[@]}"
            echo "docs_changed=$docs_changed"
            echo "homepage_changed=$homepage_changed"
            echo "readme_changed=$readme_changed"
            echo "contributing_changed=$contributing_changed"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release documentation (attempt 1)
        id: validation_first
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/release-validation-attempt-1.log"
          status=0
          mapfile -t markdown_files < <(
            {
              git diff --name-only --diff-filter=ACM -- '*.md' '*.mdx'
              git ls-files --others --exclude-standard -- '*.md' '*.mdx'
            } | grep -v '^upstream-cradlexc/' | sort -u
          )
          if [[ "${#markdown_files[@]}" -gt 0 ]]; then
            npx --yes markdownlint-cli2@0.18.1 --fix "${markdown_files[@]}" 2>&1 | tee -a "$log" || status=1
          fi

          npx --yes markdownlint-cli2@0.18.1 \
            '**/*.md' \
            '**/*.mdx' \
            '#node_modules/**' \
            '#build/**' \
            '#.docusaurus/**' \
            '#.venv/**' \
            '#upstream-cradlexc/**' 2>&1 | tee -a "$log" || status=1

          npm run build 2>&1 | tee -a "$log" || status=1
          git restore --worktree src/data/release-notes.json
          exit "$status"

      - name: Check generated-site links (attempt 1)
        id: links_first
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir ./build
            --remap
            '^https://cradle-lang\.org/(.*)$ file://${{ github.workspace }}/build/$1'
            './build/**/*.html'
          fail: true

      - name: Remove generated link-check report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f lychee/out.md ]]; then
            rm -- lychee/out.md
          fi
          rmdir lychee 2>/dev/null || true

      - name: Ask Copilot to repair failed checks
        if: >-
          always() &&
          (steps.validation_first.outcome == 'failure' ||
          steps.links_first.outcome == 'failure')
        id: repair
        continue-on-error: true
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          TAG: ${{ inputs.tag }}
          VALIDATION_OUTCOME: ${{ steps.validation_first.outcome }}
          LINKS_OUTCOME: ${{ steps.links_first.outcome }}
        run: |
          set -euo pipefail
          validation_log="$RUNNER_TEMP/release-validation-attempt-1.log"
          details='No Markdown or build log was captured.'
          if [[ -s "$validation_log" ]]; then
            details="$(tail -n 400 "$validation_log")"
          fi

          prompt="The first automated validation of the CradleXC $TAG documentation update failed.

          Markdown/build result: $VALIDATION_OUTCOME
          Generated-site link result: $LINKS_OUTCOME

          Fix only failures caused by the generated release documentation. You may edit only release-notes/$TAG.md, docs/**, src/pages/index.tsx, src/components/homepage/**, static/img/home/**, the current transcript under .current in src/data/homepage-terminal.json, README.rst, and CONTRIBUTING.md. Never edit .versions in the terminal data. Do not edit workflows, dependencies, lockfiles, markers, versions.json, versioned_docs/, versioned_sidebars/, other generated data, or build output. Do not commit, push, or create a pull request.

          Validation output:
          $details"

          copilot \
            --prompt "$prompt" \
            --no-ask-user \
            --no-custom-instructions \
            --disable-builtin-mcps \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            --max-ai-credits 20 \
            --allow-tool write \
            --allow-tool 'shell(cat)' \
            --allow-tool 'shell(find)' \
            --allow-tool 'shell(git diff:*)' \
            --allow-tool 'shell(git status)' \
            --allow-tool 'shell(grep)' \
            --allow-tool 'shell(head)' \
            --allow-tool 'shell(ls)' \
            --allow-tool 'shell(rg)' \
            --allow-tool 'shell(sed)' \
            --allow-tool 'shell(tail)'

      - name: Verify final changes use only approved paths
        if: always()
        id: changes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: release-notes/${{ inputs.tag }}.md
          REQUIRES_DOCUMENTATION: ${{ steps.prework.outputs.requires_documentation }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | grep -v '^upstream-cradlexc/$' | sort -u
          )

          found_target=false
          docs_changed=false
          homepage_changed=false
          terminal_changed=false
          readme_changed=false
          contributing_changed=false
          for path in "${changed[@]}"; do
            case "$path" in
              "$TARGET") found_target=true ;;
              docs/*) docs_changed=true ;;
              src/pages/index.tsx|src/components/homepage/*|static/img/home/*) homepage_changed=true ;;
              src/data/homepage-terminal.json)
                homepage_changed=true
                terminal_changed=true
                ;;
              README.rst) readme_changed=true ;;
              CONTRIBUTING.md) contributing_changed=true ;;
              *)
                echo "::error::Copilot changed a disallowed path: $path"
                exit 1
                ;;
            esac
          done

          if [[ "$found_target" != true ]]; then
            echo "::error::Copilot did not create the required $TARGET."
            exit 1
          fi
          if [[ "$REQUIRES_DOCUMENTATION" == true && "$docs_changed" != true ]]; then
            echo "::error::Copilot did not update any user documentation under docs/."
            exit 1
          fi
          if [[ "$terminal_changed" != true ]]; then
            echo "::error::Copilot did not update the animated-terminal transcript."
            exit 1
          fi
          if ! jq -e --arg tag "$TAG" '.current.tag == $tag' src/data/homepage-terminal.json >/dev/null; then
            echo "::error::The current terminal transcript does not identify $TAG."
            exit 1
          fi
          staged_versions="$(git show :src/data/homepage-terminal.json | jq -S -c '.versions')"
          current_versions="$(jq -S -c '.versions' src/data/homepage-terminal.json)"
          if [[ "$current_versions" != "$staged_versions" ]]; then
            echo "::error::Copilot modified an archived terminal transcript."
            exit 1
          fi
          {
            echo 'safe=true'
            echo "count=${#changed[@]}"
            echo "docs_changed=$docs_changed"
            echo "homepage_changed=$homepage_changed"
            echo "readme_changed=$readme_changed"
            echo "contributing_changed=$contributing_changed"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release documentation (attempt 2)
        if: >-
          always() &&
          steps.changes.outputs.safe == 'true' &&
          (steps.validation_first.outcome == 'failure' ||
          steps.links_first.outcome == 'failure')
        id: validation_second
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          status=0
          mapfile -t markdown_files < <(
            {
              git diff --name-only --diff-filter=ACM -- '*.md' '*.mdx'
              git ls-files --others --exclude-standard -- '*.md' '*.mdx'
            } | grep -v '^upstream-cradlexc/' | sort -u
          )
          if [[ "${#markdown_files[@]}" -gt 0 ]]; then
            npx --yes markdownlint-cli2@0.18.1 --fix "${markdown_files[@]}" || status=1
          fi

          npx --yes markdownlint-cli2@0.18.1 \
            '**/*.md' \
            '**/*.mdx' \
            '#node_modules/**' \
            '#build/**' \
            '#.docusaurus/**' \
            '#.venv/**' \
            '#upstream-cradlexc/**' || status=1

          npm run build || status=1
          git restore --worktree src/data/release-notes.json
          exit "$status"

      - name: Check generated-site links (attempt 2)
        if: >-
          always() &&
          steps.changes.outputs.safe == 'true' &&
          (steps.validation_first.outcome == 'failure' ||
          steps.links_first.outcome == 'failure')
        id: links_second
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --root-dir ./build
            --remap
            '^https://cradle-lang\.org/(.*)$ file://${{ github.workspace }}/build/$1'
            './build/**/*.html'
          fail: true

      - name: Commit and push combined branch
        if: always() && steps.changes.outputs.safe == 'true'
        id: commit
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          BRANCH: ${{ inputs.historical_test && format('test-release/{0}', inputs.tag) || format('release/{0}', inputs.tag) }}
          HISTORICAL_TEST: ${{ inputs.historical_test }}
        run: |
          set -euo pipefail
          if [[ "$HISTORICAL_TEST" != "true" ]]; then
            printf '%s\n' "$TAG" > release-notes/.last-processed-release
            printf '%s\n' "$TAG" > .cradlexc-docs-source-tag
            printf '%s\n' "$UPSTREAM_SHA" > .cradlexc-docs-source-revision
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin \
              "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          fi
          git switch -C "$BRANCH"

          approved_paths=(
            release-notes
            .cradlexc-docs-source-tag
            .cradlexc-docs-source-revision
            versions.json
            versioned_docs
            versioned_sidebars
            docs
            src/pages/index.tsx
            src/components/homepage
            src/data/homepage-terminal.json
            static/img/home
            README.rst
            CONTRIBUTING.md
          )
          for path in "${approved_paths[@]}"; do
            if [[ -e "$path" ]] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done
          if [[ "$HISTORICAL_TEST" == "true" ]]; then
            git commit -m "Test documentation generation for CradleXC $TAG"
          else
            git commit -m "Prepare documentation for CradleXC $TAG"
          fi
          git push --force-with-lease --set-upstream origin "$BRANCH"

      - name: Create or update pull request
        if: always() && steps.commit.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ inputs.historical_test && format('test-release/{0}', inputs.tag) || format('release/{0}', inputs.tag) }}
          HISTORICAL_TEST: ${{ inputs.historical_test }}
          CHANGE_COUNT: ${{ steps.changes.outputs.count }}
          ARCHIVED_VERSION: ${{ steps.archive.outputs.version }}
          DOCS_CHANGED: ${{ steps.changes.outputs.docs_changed }}
          HOMEPAGE_CHANGED: ${{ steps.changes.outputs.homepage_changed }}
          README_CHANGED: ${{ steps.changes.outputs.readme_changed }}
          CONTRIBUTING_CHANGED: ${{ steps.changes.outputs.contributing_changed }}
          VALIDATION_FIRST: ${{ steps.validation_first.outcome }}
          LINKS_FIRST: ${{ steps.links_first.outcome }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          VALIDATION_SECOND: ${{ steps.validation_second.outcome }}
          LINKS_SECOND: ${{ steps.links_second.outcome }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          PREVIOUS_TAG: ${{ steps.archive.outputs.tag }}
          EVIDENCE_PATH: ${{ steps.evidence.outputs.path }}
          EVIDENCE_SHA256: ${{ steps.evidence.outputs.sha256 }}
          EVIDENCE_COMMITS: ${{ steps.evidence.outputs.commit_count }}
          EVIDENCE_FILES: ${{ steps.evidence.outputs.file_count }}
          EVIDENCE_REBUILT: ${{ steps.evidence.outputs.rebuilt }}
          PREWORK_PATH: ${{ steps.prework.outputs.path }}
          PREWORK_SHA256: ${{ steps.prework.outputs.sha256 }}
          IMPACT_CLASSIFICATION: ${{ steps.prework.outputs.classification }}
          REQUIRES_DOCUMENTATION: ${{ steps.prework.outputs.requires_documentation }}
          RISK_COUNT: ${{ steps.prework.outputs.risk_count }}
        run: |
          set -euo pipefail

          title="Prepare documentation for CradleXC $TAG"
          pr_mode='ready'
          review_notice='This PR requires human technical and editorial review before merging.'
          if [[ "$VALIDATION_FIRST" == "success" && "$LINKS_FIRST" == "success" ]]; then
            validation_notice="All automated checks passed on the first attempt."
            validation_details="- Attempt 1 — Markdown/MDX and build: passed; generated-site links: passed."
          elif [[ "$VALIDATION_SECOND" == "success" && "$LINKS_SECOND" == "success" ]]; then
            validation_notice="All automated checks passed on the second attempt after a Copilot repair pass."
            validation_details="$(printf '%s\n' \
              "- Attempt 1 — Markdown/MDX and build: $VALIDATION_FIRST; generated-site links: $LINKS_FIRST." \
              "- Copilot repair: $REPAIR_OUTCOME." \
              "- Attempt 2 — Markdown/MDX and build: passed; generated-site links: passed.")"
          else
            pr_mode='draft'
            review_notice='This draft requires human technical and editorial review before it can be marked ready.'
            title="[Validation failing] $title"
            validation_notice="> [!WARNING]
          > Automated validation is still failing after two attempts. This draft was opened so a maintainer can inspect and fix the remaining problems before merging."
            validation_details="$(printf '%s\n' \
              "- Attempt 1 — Markdown/MDX and build: $VALIDATION_FIRST; generated-site links: $LINKS_FIRST." \
              "- Copilot repair: $REPAIR_OUTCOME." \
              "- Attempt 2 — Markdown/MDX and build: $VALIDATION_SECOND; generated-site links: $LINKS_SECOND.")"
          fi

          test_notice=''
          marker_summary='- Updated the release-processing markers.'
          if [[ "$HISTORICAL_TEST" == "true" ]]; then
            pr_mode='draft'
            title="[TEST ONLY] $title"
            review_notice='This historical-test draft must never be merged. Close it and delete its branch after inspection.'
            test_notice="> [!CAUTION]
          > Historical test mode generated this PR only to inspect the automation. Do not merge it."
            marker_summary='- Left production release-processing markers unchanged.'
          fi

          if [[ "$ARCHIVED_VERSION" == "none" ]]; then
            archive_summary="No documentation snapshot was created because there was no eligible previous stable version."
            versioning_checkbox='- [ ] Documentation versioning'
            compatibility_summary="Current documentation and release notes now describe CradleXC $TAG. No historical snapshot was created by this run."
          else
            archive_summary="Archived the previous current documentation and animated-terminal transcript as version \`$ARCHIVED_VERSION\`."
            versioning_checkbox='- [x] Documentation versioning'
            compatibility_summary="Current documentation and release notes now describe CradleXC $TAG. The previous documentation remains available under its versioned \`/docs/\` route."
          fi
          if [[ "$HISTORICAL_TEST" == "true" ]]; then
            compatibility_summary="Test-only simulation for historical CradleXC $TAG. The proposed current-doc changes intentionally model that older codebase and must not be published."
          fi

          optional_changes=()
          if [[ "$DOCS_CHANGED" == "true" ]]; then
            optional_changes+=("- Updated affected pages under \`docs/\`.")
          fi
          if [[ "$HOMEPAGE_CHANGED" == "true" ]]; then
            optional_changes+=("- Updated affected homepage content or assets.")
          fi
          if [[ "$README_CHANGED" == "true" ]]; then
            optional_changes+=("- Updated \`README.rst\` where release behavior changed project guidance.")
          fi
          if [[ "$CONTRIBUTING_CHANGED" == "true" ]]; then
            optional_changes+=("- Updated \`CONTRIBUTING.md\` where release behavior changed contributor guidance.")
          fi
          if [[ "${#optional_changes[@]}" -eq 0 ]]; then
            optional_changes+=("- No conditional documentation, homepage, README, or contributing changes were required by the verified upstream changes.")
          fi

          website_checkbox='- [ ] Website functionality'
          manual_verification='Pending human technical, editorial, rendered-page, navigation, and version-menu review before merging.'
          user_facing_evidence='N/A - no landing-page change was generated. Review affected documentation in the deploy preview or a local npm run serve session.'
          if [[ "$HOMEPAGE_CHANGED" == "true" ]]; then
            website_checkbox='- [x] Website functionality'
            manual_verification='Pending human landing-page review at desktop and mobile widths, in light and dark themes, with keyboard navigation, visible focus, 200% zoom, and reduced motion; technical and editorial review also remains required.'
            user_facing_evidence='Pending - this automated run does not capture screenshots. Add desktop/mobile and light/dark evidence after reviewing the deploy preview or a local npm run serve session.'
          fi

          body="$(printf '%s\n' \
            "## Summary" \
            "" \
            "Prepares the release notes and user documentation for CradleXC \`$TAG\` at verified commit \`$UPSTREAM_SHA\`. This keeps the current documentation aligned with the tagged compiler behavior while preserving eligible documentation for users of the previous release." \
            "" \
            "$test_notice" \
            "" \
            "$validation_notice" \
            "" \
            "## Related issue" \
            "" \
            "N/A - automated maintenance triggered by a verified CradleXC release tag." \
            "" \
            "## Change type" \
            "" \
            "- [x] Documentation/content" \
            "- [ ] UI/UX or visual design" \
            "- [ ] Workbench/playground functionality" \
            "$website_checkbox" \
            "$versioning_checkbox" \
            "- [ ] Build/CI/CD" \
            "- [ ] Dependency/configuration" \
            "- [ ] Bug fix" \
            "- [ ] Refactor/maintenance" \
            "- [ ] Other:" \
            "" \
            "## Changes made" \
            "" \
            "- Added \`release-notes/$TAG.md\` from the verified upstream tag and comparison history." \
            "- Recorded deterministic source evidence in \`$EVIDENCE_PATH\` ($EVIDENCE_COMMITS commits and $EVIDENCE_FILES changed files; SHA-256 \`$EVIDENCE_SHA256\`)." \
            "- Evidence reconstruction required: \`$EVIDENCE_REBUILT\`." \
            "- Recorded deterministic impact prework in \`$PREWORK_PATH\` (classification \`$IMPACT_CLASSIFICATION\`, $RISK_COUNT risk indicator(s); SHA-256 \`$PREWORK_SHA256\`)." \
            "- $archive_summary" \
            "- Updated the animated \`cxc doctor\` transcript from verified tagged source and runtime-dependent plugin evidence." \
            "${optional_changes[@]}" \
            "$marker_summary" \
            "" \
            "## Testing and verification" \
            "" \
            "- Automated checks:" \
            "  - Verified that the private upstream checkout exactly matches tag \`$TAG\`." \
            "  - Generated the release evidence directly from the verified \`$PREVIOUS_TAG..$TAG\` Git comparison." \
            "  - Classified documentation impact as \`$IMPACT_CLASSIFICATION\`; user-documentation update required: \`$REQUIRES_DOCUMENTATION\`." \
            "  - Required the animated terminal's current transcript to identify \`$TAG\` for every classification." \
            "  - Verified that Copilot created the required release note and changed only approved content paths ($CHANGE_COUNT content file(s))." \
            "  - Each validation attempt runs Markdown/MDX linting, \`npm run build\`, and a generated-site link check with Lychee." \
            "$validation_details" \
            "- Manual verification: $manual_verification" \
            "" \
            "## User-facing evidence" \
            "" \
            "$user_facing_evidence" \
            "" \
            "## Documentation and compatibility impact" \
            "" \
            "$compatibility_summary Review the release note and changed documentation for any required migration or compatibility guidance." \
            "" \
            "## Contributor checklist" \
            "" \
            "- [x] I reviewed my own changes and kept this PR focused." \
            "- [ ] I verified relevant documentation, navigation, and links manually." \
            "- [x] I ran the relevant repository checks and recorded the results above." \
            "- [x] I updated related documentation where behavior changed." \
            "- [x] I have not included unrelated changes." \
            "" \
            "$review_notice")"

          number="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            is_draft="$(gh pr view "$number" --json isDraft --jq '.isDraft')"
            gh pr edit "$number" --title "$title" --body "$body"
            if [[ "$pr_mode" == "ready" && "$is_draft" == "true" ]]; then
              gh pr ready "$number"
            elif [[ "$pr_mode" == "draft" && "$is_draft" == "false" ]]; then
              gh pr ready "$number" --undo
            fi
          else
            create_options=()
            if [[ "$pr_mode" == "draft" ]]; then
              create_options+=(--draft)
            fi
            gh pr create \
              "${create_options[@]}" \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body "$body"
          fi
