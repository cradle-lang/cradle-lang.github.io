name: Poll for new CradleXC tags

on:
  schedule:
    - cron: '*/30 * * * *'

  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: poll-cradlexc-releases
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: cradle-lang/CradleXC

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch all upstream tags
        shell: bash
        env:
          CRADLE_RELEASES_TOKEN: ${{ secrets.CRADLE_RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.CRADLE_RELEASES_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if [[ -z "$CRADLE_RELEASES_TOKEN" ]]; then
            echo "::error::CRADLE_RELEASES_TOKEN is required to read tags from the private ${UPSTREAM_REPOSITORY} repository."
            exit 1
          fi

          gh api --paginate \
            "repos/${UPSTREAM_REPOSITORY}/tags?per_page=100" \
            --jq '.[] | [.name, .commit.sha] | @tsv' \
            > "$RUNNER_TEMP/cradlexc-tags.txt"

          if [[ ! -s "$RUNNER_TEMP/cradlexc-tags.txt" ]]; then
            echo "::error::No tags were found in ${UPSTREAM_REPOSITORY}."
            exit 1
          fi

      - name: Reconcile release queue
        id: reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          open_pull_request_tags="$(gh pr list \
            --state open \
            --limit 100 \
            --json headRefName \
            --jq '[.[] | .headRefName | select(startswith("release/")) | sub("^release/"; "")]')"
          processing_tags="$(gh run list \
            --workflow prepare-cradlexc-release.yml \
            --limit 100 \
            --json displayTitle,status \
            --jq '[.[] | select((.status == "queued" or .status == "in_progress") and (.displayTitle | endswith(" historical=false"))) | .displayTitle | split(" ")[2]]')"
          jq -n \
            --argjson open_pull_request_tags "$open_pull_request_tags" \
            --argjson processing_tags "$processing_tags" \
            '{
              openPullRequestTags: $open_pull_request_tags,
              processingTags: $processing_tags
            }' \
            > "$RUNNER_TEMP/cradlexc-queue-signals.json"

          node scripts/reconcile-cradlexc-releases.mjs \
            "$RUNNER_TEMP/cradlexc-tags.txt" \
            release-notes \
            "$RUNNER_TEMP/cradlexc-queue-signals.json" \
            "$RUNNER_TEMP/cradlexc-release-queue.json"

      - name: Report queue is up to date
        if: steps.reconcile.outputs.has_outstanding == 'false'
        shell: bash
        run: |
          echo 'No outstanding CradleXC releases found.'
          echo 'Queue is up to date. No prepare workflow will be triggered.'

      - name: Preserve release queue snapshot
        if: steps.reconcile.outputs.has_outstanding == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cradlexc-release-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/cradlexc-release-queue.json
          retention-days: 14

      - name: Apply selected release state
        if: steps.reconcile.outputs.has_outstanding == 'true'
        id: status
        shell: bash
        env:
          TAG: ${{ steps.reconcile.outputs.selected }}
          STATE: ${{ steps.reconcile.outputs.selected_state }}
          SHOULD_DISPATCH: ${{ steps.reconcile.outputs.should_dispatch }}
        run: |
          set -euo pipefail

          if [[ "$SHOULD_DISPATCH" != 'true' ]]; then
            echo "Oldest outstanding release $TAG is $STATE; no dispatch is required."
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Oldest outstanding release $TAG is $STATE and may proceed."
          echo "should_dispatch=true" >> "$GITHUB_OUTPUT"

      - name: Prepare the selected release documentation
        if: steps.status.outputs.should_dispatch == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ steps.reconcile.outputs.selected_sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.reconcile.outputs.selected }}
        run: |
          set -euo pipefail

          gh workflow run prepare-cradlexc-release.yml \
            --ref "$DEFAULT_BRANCH" \
            -f "tag=$TAG" \
            -f "expected_sha=$EXPECTED_SHA" \
            -f "queue_observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
