name: Poll for new CradleXC releases

on:
  schedule:
    - cron: '*/30 * * * *'

  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing CradleXC release tag (defaults to latest)
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: poll-cradlexc-releases
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: cradle-lang/CradleXC

jobs:
  check-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v4

      - name: Resolve upstream release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CRADLE_RELEASES_TOKEN || github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_TAG" ]]; then
            endpoint="repos/${UPSTREAM_REPOSITORY}/releases/tags/${REQUESTED_TAG}"
          else
            endpoint="repos/${UPSTREAM_REPOSITORY}/releases/latest"
          fi

          release_json="$RUNNER_TEMP/cradlexc-release.json"
          gh api "$endpoint" > "$release_json"

          tag="$(jq -r '.tag_name' "$release_json")"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Upstream returned an invalid release tag: $tag"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check whether the release needs processing
        id: status
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          marker='release-notes/.last-processed-release'
          previous=''

          if [[ -f "$marker" ]]; then
            previous="$(tr -d '[:space:]' < "$marker")"
          fi

          if [[ "$TAG" == "$previous" ]]; then
            echo "Release $TAG has already been processed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh pr list \
            --state open \
            --head "release-notes/${TAG}" \
            --json number \
            --jq 'length > 0' | grep -qx true; then
            echo "A release-note PR for $TAG is already open."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detected release $TAG (previously processed: ${previous:-none})."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask Copilot to author the release-note PR
        if: steps.status.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          gh workflow run generate-cradlexc-release-notes.lock.yml \
            --ref "$GITHUB_REF_NAME" \
            -f "tag=$TAG"
