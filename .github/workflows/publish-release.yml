name: Publish approved release notes

on:
  push:
    branches:
      - main
    paths:
      - 'release-notes/v*.md'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-release-notes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Start publication operations timing
        id: operations_start
        shell: bash
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Check out release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed release notes
        id: changed
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          candidates="$RUNNER_TEMP/changed-release-note-candidates.txt"

          git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" |
            grep -E '^release-notes/v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?\.md$' \
            > "$candidates" || true

          : > /tmp/changed-release-notes.txt

          while IFS= read -r note; do
            tag="$(basename "$note" .md)"

            if node scripts/check-release-policy.mjs production "$tag"; then
              echo "$note" >> /tmp/changed-release-notes.txt
              continue
            else
              policy_status=$?
            fi

            if [[ "$policy_status" -eq 2 ]]; then
              echo "Skipping release note excluded by production policy: $note"
              continue
            fi

            exit "$policy_status"
          done < "$candidates"

          if [[ ! -s /tmp/changed-release-notes.txt ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"

          echo "Changed release notes:"
          cat /tmp/changed-release-notes.txt

      - name: Validate release notes
        if: steps.changed.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r note; do
            TAG="$(basename "$note" .md)"

            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error file=${note}::Invalid release tag: ${TAG}"
              exit 1
            fi

            if [[ ! -s "$note" ]]; then
              echo "::error file=${note}::Release note is empty"
              exit 1
            fi

            if ! head -n 1 "$note" | grep -q "^# "; then
              echo "::error file=${note}::Release note must begin with a level-one heading"
              exit 1
            fi
          done < /tmp/changed-release-notes.txt

      - name: Create or update GitHub Releases
        if: steps.changed.outputs.found == 'true'
        id: publish
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          while IFS= read -r note; do
            TAG="$(basename "$note" .md)"
            TITLE="CRADLE ${TAG}"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Updating existing release $TAG"

              gh release edit "$TAG" \
                --title "$TITLE" \
                --notes-file "$note"
            else
              echo "Creating release $TAG"

              gh release create "$TAG" \
                --target main \
                --title "$TITLE" \
                --notes-file "$note"
            fi
          done < /tmp/changed-release-notes.txt

      - name: Collect associated release pull requests
        if: always() && steps.changed.outputs.found == 'true'
        shell: bash
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GH_REPO/commits/$AFTER/pulls" \
            > "$RUNNER_TEMP/release-pull-requests.json"; then
            echo '::warning::Review duration is unavailable because associated PRs could not be read.'
            echo '[]' > "$RUNNER_TEMP/release-pull-requests.json"
          fi

      - name: Record publication operations metrics
        if: always() && steps.changed.outputs.found == 'true'
        id: operations_metrics
        shell: bash
        env:
          PUBLICATION_STARTED_AT: ${{ steps.operations_start.outputs.started_at }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          node scripts/write-release-publication-metrics.mjs \
            /tmp/changed-release-notes.txt \
            "$RUNNER_TEMP/release-pull-requests.json" \
            "$RUNNER_TEMP/release-publication-operations.json"

      - name: Retain publication operations metrics
        if: always() && steps.operations_metrics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cradlexc-release-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/release-publication-operations.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce publication outcome
        if: always() && steps.changed.outputs.found == 'true'
        shell: bash
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_OUTCOME" != 'success' ]]; then
            echo '::error::Release publication failed; preparation and review remain completed.'
            exit 1
          fi
