name: Sync validated configuration library
on:
  repository_dispatch:
    types: [configuration-library-updated]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful full configuration validation run ID on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: configuration-library-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify sync credentials
        env:
          SOURCE_TOKEN: ${{ secrets.CRADLE_LANG_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo 'Configure CRADLE_LANG_TOKEN: Actions/Contents read on cradle-lib and Contents/Pull requests write on this website.'
            exit 1
          fi
      - name: Verify full configuration validation and select artifact
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id || inputs.source_run_id }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        with:
          github-token: ${{ secrets.CRADLE_LANG_TOKEN }}
          script: |
            const {configRunId, verifyConfigRun, selectConfigArtifact} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/config-sync-source.mjs`);
            const source = {owner: 'cradle-lang', repo: 'cradle-lib'};
            const runId = configRunId(process.env.SOURCE_RUN_ID);
            const {data: run} = await github.rest.actions.getWorkflowRun({...source, run_id: runId});
            if (context.eventName === 'repository_dispatch' && (!process.env.SOURCE_REPOSITORY || !process.env.SOURCE_SHA)) throw new Error('Dispatch requires source_repository and source_sha');
            const sha = verifyConfigRun(run, context.eventName === 'repository_dispatch' ? {repository: process.env.SOURCE_REPOSITORY, revision: process.env.SOURCE_SHA} : {});
            const {data: branch} = await github.rest.repos.getBranch({...source, branch: 'main'});
            if (branch.commit.sha !== sha) {core.notice('Skipping stale configuration source'); core.setOutput('current', 'false'); return;}
            const artifact = selectConfigArtifact(await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...source, run_id: runId}));
            core.setOutput('current', 'true');
            core.setOutput('sha', sha);
            core.setOutput('run-id', runId);
            core.setOutput('artifact-id', artifact.id);
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.current == 'true'
        with:
          github-token: ${{ secrets.CRADLE_LANG_TOKEN }}
          repository: cradle-lang/cradle-lib
          run-id: ${{ steps.source.outputs.run-id }}
          artifact-ids: ${{ steps.source.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/config-bundle
      - uses: actions/setup-node@v4
        if: steps.source.outputs.current == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install locked website dependencies
        if: steps.source.outputs.current == 'true'
        run: npm ci --ignore-scripts
      - name: Test configuration import and source verification
        if: steps.source.outputs.current == 'true'
        run: npm run test:config-sync
      - name: Import versioned configuration articles
        if: steps.source.outputs.current == 'true'
        env:
          CONFIG_BUNDLE: ${{ runner.temp }}/config-bundle/bundle.json
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run-id }}
        run: npm run library:sync-configs
      - name: Check website and build output
        if: steps.source.outputs.current == 'true'
        run: |
          npm run typecheck
          npm run test:collection
          npm run build
          npm run test:library-build
      - name: Recheck source freshness
        id: freshness
        if: steps.source.outputs.current == 'true'
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          github-token: ${{ secrets.CRADLE_LANG_TOKEN }}
          script: |
            const {data: branch} = await github.rest.repos.getBranch({owner: 'cradle-lang', repo: 'cradle-lib', branch: 'main'});
            core.setOutput('current', String(branch.commit.sha === process.env.SOURCE_SHA));
      - name: Open or update configuration website review PR
        id: review
        if: steps.freshness.outputs.current == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CRADLE_LANG_TOKEN }}
          branch: configuration-library-sync
          base: main
          delete-branch: true
          add-paths: |
            library/configurations/*/index.md
            library/configuration-library.json
          commit-message: Sync validated configuration library articles
          title: Sync validated configuration library articles
          body: |
            Imports configuration documentation from cradle-lang/cradle-lib at ${{ steps.source.outputs.sha }}.

            Validation: https://github.com/cradle-lang/cradle-lib/actions/runs/${{ steps.source.outputs.run-id }}

            Module implementations remain in the source repository. Draft flags are preserved; removed managed entries are drafted. Heuristic and manual configuration articles are retained. TypeScript, collection tests, the production build and library output checks passed before this PR was created.

            Review and merge to publish through Pages. These checks do not certify provisioning or runtime behavior.
      - name: Report review PR
        if: steps.freshness.outputs.current == 'true'
        uses: actions/github-script@v7
        env:
          REVIEW_URL: ${{ steps.review.outputs.pull-request-url }}
        with:
          script: |
            await core.summary.addHeading('configuration website sync').addRaw(process.env.REVIEW_URL || 'No changes require a PR.').write();
