name: Poll CradleXC tags for documentation changes

on:
  schedule:
    # Stagger this from the release-note poller while still running every 30 minutes.
    - cron: '17,47 * * * *'

  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing CradleXC tag (defaults to latest)
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: poll-cradlexc-docs
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: cradle-lang/CradleXC

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v4

      - name: Resolve upstream tag
        id: upstream
        shell: bash
        env:
          CRADLE_RELEASES_TOKEN: ${{ secrets.CRADLE_RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.CRADLE_RELEASES_TOKEN || github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "$CRADLE_RELEASES_TOKEN" ]]; then
            echo "::error::CRADLE_RELEASES_TOKEN is required to read tags from the private ${UPSTREAM_REPOSITORY} repository."
            exit 1
          fi

          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::The requested tag is invalid: $REQUESTED_TAG"
              exit 1
            fi

            gh api "repos/${UPSTREAM_REPOSITORY}/git/ref/tags/${REQUESTED_TAG}" > /dev/null
            tag="$REQUESTED_TAG"
          else
            tags_file="$RUNNER_TEMP/cradlexc-tags.txt"
            gh api --paginate \
              "repos/${UPSTREAM_REPOSITORY}/tags?per_page=100" \
              --jq '.[].name' > "$tags_file"

            tag="$(grep -m 1 -E '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' "$tags_file" || true)"
          fi

          if [[ -z "$tag" ]]; then
            echo "::error::No valid version tags were found in ${UPSTREAM_REPOSITORY}."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag needs processing
        id: status
        shell: bash
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          marker='.cradlexc-docs-source-tag'
          previous=''

          if [[ -f "$marker" ]]; then
            previous="$(tr -d '[:space:]' < "$marker")"
          fi

          if [[ "$TAG" == "$previous" ]]; then
            echo "CradleXC tag $TAG has already been reviewed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh pr list \
            --state open \
            --json headRefName \
            --jq 'map(select(.headRefName | startswith("docs-sync/"))) | length > 0' \
            | grep -qx true; then
            echo "A documentation-sync PR is already open; deferring $TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Detected CradleXC tag $TAG (previously reviewed: ${previous:-none})."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask Copilot to synchronize the documentation
        if: steps.status.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          gh workflow run update-cradlexc-docs.yml \
            --ref "$GITHUB_REF_NAME" \
            -f "tag=$TAG"
