name: Review scenario library updates
on:
  repository_dispatch:
    types: [scenario-library-updated]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful source validation run ID from scenario_library main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scenario-library-sync
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify read credentials for the private scenario library
        env:
          SOURCE_TOKEN: ${{ secrets.SCENARIO_LIBRARY_READ_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo 'Configure SCENARIO_LIBRARY_READ_TOKEN with Actions read and Contents read access to mashmllo/scenario_library.'
            exit 1
          fi
      - name: Verify source run and reject stale or untrusted dispatches
        id: source
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCENARIO_LIBRARY_READ_TOKEN }}
          script: |
            const payload = context.payload.client_payload || {};
            const dispatched = context.eventName === 'repository_dispatch';
            if (dispatched && payload.source_repository !== 'mashmllo/scenario_library') throw new Error('Unexpected source repository.');
            const runId = String(dispatched ? payload.source_run_id : context.payload.inputs.source_run_id);
            if (!/^[1-9][0-9]*$/.test(runId)) throw new Error('Invalid source run ID.');
            const source = {owner: 'mashmllo', repo: 'scenario_library'};
            const {data: run} = await github.rest.actions.getWorkflowRun({...source, run_id: runId});
            if (run.conclusion !== 'success' || run.event !== 'push' || run.head_branch !== 'main' || run.head_repository.full_name !== 'mashmllo/scenario_library' || run.path.split('@')[0] !== '.github/workflows/validate-sources.yml') throw new Error('Source run is not a successful main validation run.');
            if (dispatched && payload.source_sha !== run.head_sha) throw new Error('Dispatched revision differs from the validated source run.');
            const {data: branch} = await github.rest.repos.getBranch({...source, branch: 'main'});
            if (branch.commit.sha !== run.head_sha) {
              core.notice('Skipping stale source revision.');
              core.setOutput('accepted', 'false');
              return;
            }
            core.setOutput('accepted', 'true');
            core.setOutput('sha', run.head_sha);
            core.setOutput('run-id', runId);
      - uses: actions/checkout@v4
        if: steps.source.outputs.accepted == 'true'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.source.outputs.accepted == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Download the immutable validated two-file snapshot
        if: steps.source.outputs.accepted == 'true'
        uses: actions/download-artifact@v4
        with:
          name: website-scenarios
          path: ${{ runner.temp }}/scenario-library-bundle
          github-token: ${{ secrets.SCENARIO_LIBRARY_READ_TOKEN }}
          repository: mashmllo/scenario_library
          run-id: ${{ steps.source.outputs.run-id }}
      - name: Install website tooling
        if: steps.source.outputs.accepted == 'true'
        run: npm ci --ignore-scripts
      - name: Test and import the scenario snapshot
        if: steps.source.outputs.accepted == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node --test scripts/sync-scenario-library.test.mjs
          node scripts/sync-scenario-library.mjs "$RUNNER_TEMP/scenario-library-bundle/bundle.json" "$SOURCE_SHA"
          npm run typecheck
          npm run test:collection
          npm run build
          npm run test:library-build
      - name: Open or update the website review PR
        id: pr
        if: steps.source.outputs.accepted == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.WEBSITE_PR_TOKEN || github.token }}
          branch: sync-scenario-library
          base: main
          add-paths: |
            library/scenarios
            .github/scenario-library-source.json
          commit-message: Sync validated scenario library articles
          title: Sync validated scenario library articles
          body: |
            Import the validated source snapshot `${{ steps.source.outputs.sha }}` from mashmllo/scenario_library.

            Each synchronized `library/scenarios/<id>/` contains exactly `scenario.cradle` and `index.md`. Supporting assets remain in the source library; article links point back there. Draft settings are preserved.

            Validation run: https://github.com/mashmllo/scenario_library/actions/runs/${{ steps.source.outputs.run-id }}

            TypeScript, collection tests, the website build and library download checks passed before creating this PR. Review and merge this PR to publish through the existing Pages workflow.
      - name: Record the review PR
        if: steps.pr.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          printf 'Website review PR: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
