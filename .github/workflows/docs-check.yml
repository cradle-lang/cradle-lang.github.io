name: Build

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test release automation
        run: npm run test:release-automation

      - name: Test scenario collection
        run: npm run test:collection

      - name: Test scenario library sync
        run: npm run test:scenario-sync

      - name: Build documentation
        run: npm run build

      - name: Verify library pages and downloads
        run: npm run test:library-build
