<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.0" fill="#0b6fa4" fill-opacity="0.08"/>
    </pattern>

    <radialGradient id="dotFade" cx="76%" cy="42%" r="56%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="55%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <mask id="dotMask">
      <rect width="1600" height="900" fill="black"/>
      <ellipse cx="1310" cy="360" rx="430" ry="330" fill="url(#dotFade)"/>
    </mask>

    <style>
      .line { fill:none; stroke:#0b6fa4; stroke-opacity:.085; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; }
      .line2 { fill:none; stroke:#0b6fa4; stroke-opacity:.065; stroke-width:1; stroke-linecap:round; stroke-linejoin:round; }
      .node { fill:#0b6fa4; fill-opacity:.10; }
      .node2 { fill:#0b6fa4; fill-opacity:.065; }
      .cube { fill:none; stroke:#0b6fa4; stroke-opacity:.065; stroke-width:1; stroke-linejoin:round; }
      .shield { fill:none; stroke:#0b6fa4; stroke-opacity:.065; stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round; }
      .arc { fill:none; stroke:#0b6fa4; stroke-opacity:.055; stroke-width:1.15; }
      .arc2 { fill:none; stroke:#0b6fa4; stroke-opacity:.04; stroke-width:1.0; }
    
      /* Gentle ambient movement */
      .node,
      .node2 {
        transform-box: fill-box;
        transform-origin: center;
      }

      .pulse-a { animation: nodePulseA 5.8s ease-in-out infinite; }
      .pulse-b { animation: nodePulseB 7.2s ease-in-out infinite; }
      .pulse-c { animation: nodePulseA 6.6s ease-in-out -2.4s infinite; }

      .flow {
        fill: none;
        stroke: #0b6fa4;
        stroke-opacity: .12;
        stroke-width: 1.05;
        stroke-linecap: round;
        stroke-dasharray: 2 15;
        animation: networkFlow 12s linear infinite;
      }

      .flow-slow {
        animation-duration: 17s;
        animation-delay: -5s;
        stroke-opacity: .085;
      }

      .packet {
        fill: #0b6fa4;
        fill-opacity: .22;
      }

      @keyframes nodePulseA {
        0%, 100% { opacity: .55; transform: scale(1); }
        50% { opacity: .95; transform: scale(1.28); }
      }

      @keyframes nodePulseB {
        0%, 100% { opacity: .45; transform: scale(1); }
        50% { opacity: .8; transform: scale(1.18); }
      }

      @keyframes networkFlow {
        to { stroke-dashoffset: -68; }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse-a,
        .pulse-b,
        .pulse-c,
        .flow,
        .flow-slow {
          animation: none;
        }

        .packet {
          display: none;
        }
      }

    </style>
  </defs>

  <!-- soft dotted blueprint field -->
  <rect x="900" y="50" width="700" height="720" fill="url(#dots)" mask="url(#dotMask)"/>

  <!-- large left architectural arcs -->
  <circle class="arc" cx="-120" cy="390" r="215"/>
  <circle class="arc" cx="-120" cy="390" r="260"/>
  <circle class="arc2" cx="-120" cy="390" r="305"/>
  <circle class="arc2" cx="-120" cy="390" r="350"/>

  <!-- upper-right network -->
  <path class="line2" d="M1245 155 L1318 194 L1386 179"/>
  <path class="line2" d="M1318 194 L1382 249 L1461 287"/>
  <path class="line2" d="M1382 249 L1434 332"/>
  <circle class="node" cx="1245" cy="155" r="4.8"/>
  <circle class="node2" cx="1318" cy="194" r="3.8"/>
  <circle class="node2" cx="1386" cy="179" r="3.5"/>
  <circle class="node2" cx="1382" cy="249" r="3.8"/>
  <circle class="node2" cx="1461" cy="287" r="3.6"/>

  <!-- small shield in extreme top-right -->
  <g class="shield">
    <path d="M1435 128 L1463 138 L1491 128 V166 C1491 194 1470 214 1463 219 C1456 214 1435 194 1435 166 Z"/>
    <path d="M1463 142 V200"/>
    <path d="M1447 166 H1479"/>
  </g>

  <!-- mid-right connector -->
  <path class="line2" d="M1425 362 L1491 403 L1550 391"/>
  <path class="line2" d="M1491 403 L1538 463"/>
  <circle class="node2" cx="1425" cy="362" r="3.4"/>
  <circle class="node2" cx="1491" cy="403" r="3.7"/>
  <circle class="node2" cx="1550" cy="391" r="3.2"/>
  <circle class="node2" cx="1538" cy="463" r="3.2"/>

  <!-- lower-right network -->
  <path id="packetPathLowerA" class="line" d="M1032 760 L1110 714"/>
  <path class="line" d="M1178 738 L1210 748 L1284 694"/>

  <path class="line2" d="M1110 714 L1174 640 L1257 660"/>
  <path class="line2" d="M1210 748 L1289 797 L1389 755"/>
  <path id="packetPathLowerB" class="line2" d="M1284 694 L1376 650 L1471 701"/>
  <path class="line2" d="M1389 755 L1487 803"/>
  <path class="line2" d="M1032 760 L1103 818 L1189 793"/>
  <path class="line2" d="M1189 793 L1280 842 L1370 815"/>

  <circle class="node pulse-a" cx="1032" cy="760" r="3.8"/>
  <circle class="node2 pulse-b" cx="1110" cy="714" r="2.7"/>
  <circle class="node2" cx="1210" cy="748" r="2.7"/>
  <circle class="node2 pulse-c" cx="1284" cy="694" r="3"/>
  <circle class="node2" cx="1289" cy="797" r="3"/>
  <circle class="node2 pulse-b" cx="1389" cy="755" r="3"/>
  <circle class="node2 pulse-a" cx="1471" cy="701" r="2.8"/>
  <circle class="node2" cx="1487" cy="803" r="3"/>
  <circle class="node2" cx="1103" cy="818" r="2.5"/>
  <circle class="node2" cx="1189" cy="793" r="2.5"/>
  <circle class="node2" cx="1280" cy="842" r="2.6"/>
  <circle class="node2" cx="1370" cy="815" r="2.5"/>


  <!-- subtle animated traffic overlays -->
  <path class="flow" d="M1032 760 L1110 714"/>
  <path class="flow flow-slow" d="M1284 694 L1376 650 L1471 701"/>
  <path class="flow flow-slow" d="M1189 793 L1280 842 L1370 815"/>

  <!-- travelling packet dots -->
  <circle class="packet" r="2.3">
    <animateMotion dur="6.8s" repeatCount="indefinite">
      <mpath href="#packetPathLowerA"/>
    </animateMotion>
  </circle>

  <circle class="packet" r="2">
    <animateMotion dur="10.5s" begin="-3.5s" repeatCount="indefinite">
      <mpath href="#packetPathLowerB"/>
    </animateMotion>
  </circle>

  <!-- smaller cube 1 -->
  <g class="cube">
    <path d="M1125 721 L1149 707 L1173 721 L1149 735 Z"/>
    <path d="M1125 721 L1125 749 L1149 763 L1149 735 Z"/>
    <path d="M1149 735 L1173 721 L1173 749 L1149 763 Z"/>
  </g>

  <!-- subtle central-lower cube -->
  <g class="cube" opacity=".58">
    <path d="M1265 779 L1280 770 L1295 779 L1280 788 Z"/>
    <path d="M1265 779 L1265 797 L1280 806 L1280 788 Z"/>
    <path d="M1280 788 L1295 779 L1295 797 L1280 806 Z"/>
  </g>

  <!-- far-right cube -->
  <g class="cube" opacity=".75">
    <path d="M1427 711 L1448 699 L1469 711 L1448 723 Z"/>
    <path d="M1427 711 L1427 736 L1448 748 L1448 723 Z"/>
    <path d="M1448 723 L1469 711 L1469 736 L1448 748 Z"/>
  </g>
</svg>
